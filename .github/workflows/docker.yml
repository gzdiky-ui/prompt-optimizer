name: Docker Build and Push

# Publish only through Release, using its tested commit and version.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      ALIYUN_USERNAME:
        required: false
      ALIYUN_PASSWORD:
        required: false

env:
  DOCKERHUB_IMAGE: docker.io/linshen/prompt-optimizer
  ALIYUN_IMAGE: registry.cn-guangzhou.aliyuncs.com/prompt-optimizer/prompt-optimizer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required to read the private draft during the publication-state guard.
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Check registry credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$ALIYUN_USERNAME" ] && [ -n "$ALIYUN_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "disabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub / Aliyun credentials are not configured; skipping Docker publication."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release identity
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          DOCKER_PUBLISH_DISABLED: ${{ steps.credentials.outputs.disabled }}
        run: node scripts/release-channel.js

      - name: Recheck publication state on retries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          REQUIRE_DRAFT: 'true'
        run: node scripts/release-channel.js --check-state

      - uses: docker/login-action@v4
        if: needs.credentials.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: needs.credentials.outputs.enabled == 'true'
        with:
          registry: registry.cn-guangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build versioned images from the release commit
        id: image
        uses: docker/build-push-action@v7
        if: needs.credentials.outputs.enabled == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version_no_prefix }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version_no_prefix }}
            ${{ env.ALIYUN_IMAGE }}:${{ steps.version.outputs.version_no_prefix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both registries before promoting stable images
        if: needs.credentials.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version_no_prefix }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$ALIYUN_IMAGE"; do
            actual=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')
            test "$actual" = "$DIGEST"
            docker buildx imagetools inspect "$image@$DIGEST"
          done
          echo "Verified $VERSION at $DIGEST in both registries" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote stable images only
        if: steps.version.outputs.is_prerelease == 'false'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$ALIYUN_IMAGE"; do
            docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
            actual=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
            test "$actual" = "$DIGEST"
          done
